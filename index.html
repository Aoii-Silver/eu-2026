<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《六仙女的東歐探險》</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe8; --paper:#fbf9f5; --ink:#2f2b28; --muted:#7b746c; --line:#ddd5c9;
  --cz:#2F6573;  --cz-soft:#e2ecee;   /* 捷克：青綠（參考圖的主色調）*/
  --at:#5A4566;  --at-soft:#ebe6ee;   /* 奧地利：紫（參考圖的紫）*/
  --hu:#B05A72;  --hu-soft:#f4e6ea;   /* 匈牙利：玫瑰粉（參考圖的建築粉）*/
  --tr:#44474B;  --tr-soft:#ececec;   /* 航程：深灰 */
  --alert:#961904; --alert-bg:#f7e0db; --alert-deep:#7a1403;
  --pend:#E5A52E;  --pend-bg:#fcf0d2; --pend-ink:#8a5f0c;   /* 待確認：芥末黃 */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}
header.hero{text-align:center;padding:60px 0 26px}
.hero .eyebrow span{white-space:nowrap}
@media(max-width:620px){.hero .eyebrow span{display:block}}
.hero .eyebrow{font-family:Georgia,"Noto Serif TC",serif;font-style:italic;letter-spacing:.12em;font-size:14px;color:var(--muted)}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(30px,6vw,48px);margin:10px 0 6px;letter-spacing:.12em}
.cpills{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.cpill{border:0;color:#fff;padding:4px 20px;border-radius:999px;font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.25em;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08);transition:.15s}
.cpill.cz{background:var(--cz)} .cpill.at{background:var(--at)} .cpill.hu{background:var(--hu)}
.cpill:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}

.toolbar{position:sticky;top:0;z-index:10;background:rgba(243,239,232,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 14px;border-radius:2px;cursor:pointer;letter-spacing:.06em;transition:.15s}
button:hover{background:var(--ink);color:var(--paper)}

/* 待確認區 */
.pbox{background:var(--paper);border:1px solid var(--line);border-left:4px dashed var(--pend);padding:16px 20px 18px;margin-bottom:32px}
.pbox .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pbox h3{margin:0;font-family:"Noto Serif TC",serif;font-size:17px;letter-spacing:.1em;color:var(--pend-ink);display:flex;align-items:center;gap:10px}
.pbox h3 .n{font-family:"Noto Sans TC";font-size:12px;background:var(--pend);color:#fff;border-radius:999px;padding:0 9px;letter-spacing:0}
.plus{width:19px;height:19px;padding:0;border-radius:50%;font-size:12px;line-height:1;border-color:var(--pend);color:var(--pend-ink)}
.plus:hover{background:var(--pend);color:#fff}
.plist{list-style:none;margin:0;padding:0;font-size:14px}
.plist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist input[type=checkbox]{accent-color:var(--pend);width:16px;height:16px;flex:none;transform:translateY(3px);cursor:pointer}
.plist label{cursor:pointer;flex:1}
.plist a.jump{color:var(--muted);font-size:12.5px;text-decoration:none;border-bottom:1px dotted var(--muted);flex:none;min-width:42px}
.plist .empty{color:var(--muted)}
.pform{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--pend)}
.pform select{width:auto;min-width:150px} .pform input[type=text]{flex:1;min-width:200px}
.hidden{display:none!important}

/* 每日卡片 */
.day{position:relative;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);margin:0 0 16px;display:grid;grid-template-columns:132px 1fr}
@media(max-width:620px){.day{grid-template-columns:1fr}}
.day{--ct:var(--c);--on:#fff}
.day.cz{--c:var(--cz);--cs:var(--cz-soft)} .day.at{--c:var(--at);--cs:var(--at-soft)}
.day.hu{--c:var(--hu);--cs:var(--hu-soft)} .day.tr{--c:var(--tr);--cs:var(--tr-soft)}
.dhead{background:var(--cs);padding:18px 16px;border-right:1px solid var(--line)}
.dhead .date{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:700;color:var(--ct);line-height:1.1}
.dhead .wk{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.tag{display:inline-block;font-size:11.5px;color:var(--on);background:var(--c);padding:1px 10px;border-radius:999px;letter-spacing:.12em}
.dhead .mt{display:none}
.dbody{padding:16px 22px 16px}
.dbody h2{margin:0 0 8px;font-family:"Noto Serif TC",serif;font-size:19px;font-weight:600;letter-spacing:.05em;color:var(--ct);display:flex;align-items:center;gap:8px}
.empty-day{color:var(--muted);font-size:13.5px;padding:4px 0}
.day{scroll-margin-top:72px}
.day.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--c)}}

.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:6px 8px;margin:2px 0;border-left:3px solid transparent;border-radius:2px;font-size:14.5px}
.item:hover{background:rgba(0,0,0,.025)}
.ty{font-size:11px;padding:0 8px;border:1px solid var(--c);color:var(--ct);border-radius:2px;letter-spacing:.08em;white-space:nowrap;align-self:start;margin-top:3px;background:var(--cs);min-width:52px;text-align:center}
.ty.交通{background:transparent}
.ty.住宿{background:var(--c);color:var(--on)}
.ty-sp{min-width:52px;visibility:hidden}
.tys{display:flex;flex-direction:column;gap:2px;align-self:start;margin-top:3px}
.tys .ty{margin-top:0}
.item .main{min-width:0}
.item .time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ct);margin-right:8px}
.item a.lnk{color:var(--ct);margin-left:8px;font-size:13px;white-space:nowrap}
.item a.lnk svg{vertical-align:-2px;margin-right:3px}
.item.note .txt{color:var(--muted);font-size:13.5px}
.item.note{padding-top:0;margin-top:0;line-height:1.5}
.item:has(+ .item.note){padding-bottom:1px;margin-bottom:0}
.acts{display:flex;gap:2px;opacity:.55;transition:.15s;white-space:nowrap}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.ib{border:0;padding:1px 6px;font-size:12px;color:var(--muted);letter-spacing:0}
.ib:hover{background:transparent;color:var(--ink);text-decoration:underline}
.ib.del:hover{color:var(--alert)}

/* 手機版：標籤列、編輯/刪除直排、長按拖曳排序 */
@media(max-width:620px){
  .dhead{display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:auto 1fr;grid-template-areas:"date wk title" "tag tag title";align-items:baseline;column-gap:4px;row-gap:6px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .dl{display:contents}
  .dl .date{grid-area:date;font-size:26px}
  .dl .wk{grid-area:wk;margin:0}
  .dl .tag{grid-area:tag;justify-self:start}
  .dhead .mt{grid-area:title;display:flex!important;align-items:baseline;gap:5px;min-width:0;margin:0 0 0 6px;font-family:"Noto Serif TC",serif;font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--ct);line-height:1.3}
  .dbody>h2{display:none}
  .acts{flex-direction:row;gap:0;align-self:center;opacity:.7}
  .acts .mv{display:none}
  .acts .ib{padding:4px 8px;font-size:22px;line-height:1.2}
  .acts{opacity:.85}
  .item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
}
.item.lift{position:relative;z-index:20;background:var(--paper);box-shadow:0 8px 22px rgba(0,0,0,.22);transition:none;opacity:.97}
.item.imp.lift{background:var(--alert-bg)}
.item.drop-before{box-shadow:0 -2px 0 var(--c)}
.item.drop-after{box-shadow:0 2px 0 var(--c)}
body.dragging{overflow-anchor:none}
.pchk{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:12px;color:#fff;background:var(--pend);border:0;padding:0 8px;border-radius:2px;cursor:pointer;white-space:nowrap}
.pchk input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:0;border-radius:2px;background:rgba(255,255,255,.92);margin:0;cursor:pointer;position:relative}
.pchk input:checked::after{content:"✓";position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;color:var(--pend);font-weight:700}

/* 重要！ */
.item.imp{background:var(--alert-bg);border-left-color:var(--alert);color:var(--alert-deep);font-weight:700;font-size:13.5px;padding:4px 8px}
.item.imp .time{color:var(--alert-deep)} .item.imp .ty{color:var(--alert-deep);border-color:var(--alert);background:#fff}
.item.imp .ty.tag-imp{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:500}
/* 待確認 */
.item.pend:not(.imp){background:var(--pend-bg)}
/* 備註標為重要：只改成粗體紅字，不整行 highlight、不加標籤 */
.item.imp-note .txt{color:var(--alert-deep);font-weight:700}
.item.imp-note .txt::before{content:"!";display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--alert);color:#fff;font-size:10px;margin-right:6px;vertical-align:1px}

.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.addb{border-color:var(--c);color:var(--ct);font-size:11.25px;padding:2.7px 10.8px}
.addb:hover{background:var(--c);color:var(--on)}

/* 表單 */
.form{background:#fff;border:1px solid var(--line);border-left:3px solid var(--c);padding:12px 14px;margin:6px 0}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
input[type=text],select{width:100%;font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px}
.form .f1{flex:1;min-width:140px} .form .f2{flex:2;min-width:220px}
.form .chk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;color:var(--pend-ink);cursor:pointer}
.form .chk input{accent-color:var(--pend)}
.form .chks{display:flex;gap:20px;flex-wrap:wrap}
.form .chk.imp{color:var(--alert);font-weight:700}
.form .chk.imp input{accent-color:var(--alert)}
.form .fb{display:flex;gap:8px;margin-top:12px}
.form .fb .ok{background:var(--c);border-color:var(--c);color:var(--on)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 20px;border-radius:2px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;letter-spacing:.1em}
/* 同步狀態 */
.sync{font-size:12px;color:var(--muted);align-self:center;margin-right:6px;letter-spacing:.04em}

/* 密碼提示窗（鑰匙孔插圖） */
.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(30,24,19,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .55s ease,visibility .55s}
.lock.gone{opacity:0;visibility:hidden;pointer-events:none}
body.locked{overflow:hidden}
.plate{--parch:#f0dabb;position:relative;width:min(360px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:10px;background:var(--parch);box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(110,80,35,.4);color:#4a3622;text-align:center;transition:transform .6s ease,opacity .6s ease}
.plate::after{content:"";position:absolute;inset:8px;border:1px solid rgba(140,105,50,.32);border-radius:6px;pointer-events:none}
.plate.open{transform:scale(1.05);opacity:0;transition-delay:.35s}
.plate.err{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.plate .art{position:relative}
.plate .art img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,#000 86%,transparent 100%)}
.plate .glow{position:absolute;left:49.7%;top:49.5%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.95) 0%,rgba(244,190,95,.55) 35%,rgba(244,190,95,0) 68%);mix-blend-mode:screen;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .7s ease}
.plate:focus-within .glow{opacity:.6;transform:translate(-50%,-50%) scale(1)}
.plate.open .glow{opacity:1;transform:translate(-50%,-50%) scale(2.6)}
.plate.err .glow{opacity:.85;transform:translate(-50%,-50%) scale(1);background:radial-gradient(circle,rgba(230,90,70,.9) 0%,rgba(230,90,70,.45) 35%,rgba(230,90,70,0) 68%)}
.plate .body{position:relative;margin-top:-13%;padding:0 36px 28px}
.plate .eb{font-size:10.5px;letter-spacing:.38em;color:#8a6a34;padding-left:.38em}
.plate h2{font-family:"Noto Serif TC",serif;font-size:21px;letter-spacing:.3em;padding-left:.3em;margin:6px 0 4px;font-weight:600;color:#4a3622}
.plate .sub{font-size:12.5px;color:#7a6548;letter-spacing:.08em;margin-bottom:18px}
.plate input{width:100%;background:rgba(255,248,232,.55);border:0;border-bottom:1px solid rgba(110,80,35,.6);color:#3a2a18;text-align:center;font:inherit;font-size:18px;letter-spacing:.35em;padding:7px 0;outline:none;border-radius:2px 2px 0 0}
.plate input::placeholder{color:#a8916a;letter-spacing:.35em}
.plate input:focus{border-bottom-color:#8a5a22;background:rgba(255,248,232,.8)}
.plate .msg{min-height:20px;font-size:12.5px;color:#a3312b;margin-top:10px;letter-spacing:.05em}
.plate .go{margin-top:8px;width:100%;background:#4a3622;border:0;color:#f0dabb;font-weight:700;letter-spacing:.5em;padding:9px 0 9px .5em;border-radius:2px}
.plate .go:hover{background:#6a4e30;color:#f6e6cc}
.plate .go:disabled{opacity:.6;cursor:wait}
.plate .demo{font-size:11.5px;color:#9a8764;margin-top:10px;min-height:16px}

</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="eyebrow"><span>The Chang Sisters:</span> <span>A Second European Chapter</span></div>
  <h1>《六仙女的東歐探險》</h1>
  <div class="cpills">
    <button class="cpill cz" data-go="cz" title="跳到捷克的第一天">捷克</button>
    <button class="cpill at" data-go="at" title="跳到奧地利的第一天">奧地利</button>
    <button class="cpill hu" data-go="hu" title="跳到匈牙利的第一天">匈牙利</button>
  </div>
</header>

<div class="toolbar">
  <div class="btns">
    <span class="sync" id="sync"></span>
  </div>
</div>

<section class="pbox" id="pbox">
  <div class="ph">
    <h3>待確認事項 <span class="n" id="pcount">0</span></h3>
    <button class="plus" id="pplus" title="新增待確認事項" aria-label="新增待確認事項">＋</button>
  </div>
  <ul class="plist" id="plist"></ul>
  <div class="pform hidden" id="pform">
    <select id="pday"></select>
    <input type="text" id="ptext" placeholder="待確認項目內容">
    <button id="padd">新增</button>
    <button id="pcancel">取消</button>
  </div>
</section>

<main id="days"></main>
<footer>— 旅伴共編行程 · 每個項目都能編輯、刪除、標記重要與待確認 —</footer>
</div>

    if(s.startsWith("＊")){ type="備註"; s=s.slice(1).trim(); }
    else if(/^(交通|火車|渡輪|地鐵)[：:]/.test(s)){ type="交通"; s=s.replace(/^交通[：:]\s*/,""); }
    else if(/^住宿[：:]/.test(s)){ type="住宿"; s=s.replace(/^住宿[：:]\s*/,""); }
    if(!s) return;
    if(type!=="備註"){ const m=s.match(TIME_RE); if(m){ time=m[1]; s=s.slice(m[0].length); } }
    if(type==="活動" && /→|航空|飛行時間/.test(s)) type="交通";
    const it={id:uid(),type,time,text:s,link:"",important,pending:PEND_RE.test(raw)};
    items.push(it); last=it;
  });
  return items;
}
const buildDefault = () => RAW.map(([id,date,wk,c,title,lines])=>({id,date,wk,c,title,items:parseLines(lines)}));

/* ---------- 儲存 ---------- */
const KEY="eu2026-itinerary-v2";
/* 相容舊資料：level>0 視為「重要」 */
function normalize(arr){ arr.forEach(d=>d.items.forEach(it=>{ if(it.important===undefined) it.important=(it.level||0)>0; delete it.level; })); return arr; }
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s));}catch(e){} return buildDefault(); }
/* ---------- Supabase 設定（填入後即為共編模式；留空 = 本機預覽） ---------- */
const SUPABASE_URL = "https://yehbfrgjyiwvapchilya.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qdjZmLGkzKrjeWxDFc8zbQ_XvMz-iXD";   // 公開用金鑰，可放在前端；資料由 RLS 保護

let sb = null, synced = {};

/* 穩定序列化：jsonb 會重排欄位順序，比對前先排序 */
const stable = o => Array.isArray(o) ? "["+o.map(stable).join(",")+"]" :
  (o && typeof o==="object") ? "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}" : JSON.stringify(o);
const dayKey = d => stable({id:d.id,date:d.date,wk:d.wk,c:d.c,title:d.title,items:d.items});
const toRow = (d,i) => ({id:d.id,pos:i,date:d.date,wk:d.wk,c:d.c,title:d.title,items:d.items,updated_at:new Date().toISOString()});
const fromRow = r => ({id:r.id,date:r.date,wk:r.wk,c:r.c,title:r.title,items:r.items||[]});
function setSync(t){ const el=document.getElementById("sync"); if(el) el.textContent=t; }

function save(){
  if(!CONFIGURED){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} return; }
  push();
}
/* 只把有變動的那幾天寫回資料庫 */
async function push(){
  const rows=[];
  data.forEach((d,i)=>{ const k=dayKey(d); if(synced[d.id]!==k){ synced[d.id]=k; rows.push(toRow(d,i)); } });
  if(!rows.length) return;
  setSync("同步中…");
  const {error}=await sb.from("days").upsert(rows);
  if(error){ rows.forEach(r=>delete synced[r.id]); setSync("同步失敗"); toast("同步失敗，請檢查網路後再試一次"); console.error(error); }
  else setSync("● 已同步");
}
async function startRemote(){
  setSync("載入中…");
  const {data:rows,error}=await sb.from("days").select("*").order("pos");
  if(error){ setSync("載入失敗"); toast("無法讀取行程資料"); console.error(error); return; }
  if(!rows.length){ data=buildDefault(); synced={}; await push(); }
  else { data=normalize(rows.map(fromRow)); data.forEach(d=>{ synced[d.id]=dayKey(d); }); }
  form=null; render(); setSync("● 已同步");
  sb.removeAllChannels();
  sb.channel("days-live").on("postgres_changes",{event:"*",schema:"public",table:"days"},onRemote).subscribe();
}
function onRemote(p){
  if(!p.new || !p.new.id) return;
  const d=fromRow(p.new); normalize([d]);
  const k=dayKey(d); if(synced[d.id]===k) return;      // 自己剛送出的，略過
  synced[d.id]=k;
  const i=data.findIndex(x=>x.id===d.id);
  if(i>=0) data[i]=d; else data.push(d);
  if(form){ toast("有旅伴更新了行程，完成編輯後會自動套用"); }
  else { render(); setSync("● 已同步"); }
}

  if(form && form.kind==="item" && form.itemId===it.id) return formHTML(d,it);

function render(){
  document.getElementById("days").innerHTML = data.map(d=>{
    const adding = form && form.kind==="item" && form.dayId===d.id && !form.itemId;

/* ---------- 手機：長按拖曳排序（含觸覺回饋）---------- */
function haptic(){
  try{ if(navigator.vibrate){ navigator.vibrate(15); return; } }catch(e){}
  try{ // iOS Safari 17.4+：切換 switch 型 checkbox 會產生觸覺回饋
    const l=document.createElement("label"); l.setAttribute("aria-hidden","true");
    l.style.cssText="position:fixed;left:-99px;top:0;opacity:0;pointer-events:none";
    l.innerHTML='<input type="checkbox" switch>'; document.body.appendChild(l); l.click(); setTimeout(()=>l.remove(),80);
  }catch(e){}
}
(function(){
  const mq = matchMedia("(max-width:620px)");
  let lp=null;
  const clear=()=>{ if(!lp) return; clearTimeout(lp.timer); clearInterval(lp.scroller);
    if(lp.on){ lp.el.classList.remove("lift"); lp.el.style.transform=""; lp.ids.forEach(x=>x.el.classList.remove("drop-before","drop-after")); document.body.classList.remove("dragging"); }
    lp=null; };
  function start(){
    if(!lp) return; const art=lp.el.closest(".day");
    lp.ids=[...art.querySelectorAll(".item[data-item]")].map(el=>({el,id:el.dataset.item}));
    lp.from=lp.ids.findIndex(x=>x.el===lp.el); lp.over=lp.from; lp.sy=scrollY; lp.cy=lp.y;
    lp.on=true; haptic(); lp.el.classList.add("lift"); document.body.classList.add("dragging");
    lp.scroller=setInterval(()=>{ if(!lp||!lp.on) return; const h=innerHeight;
      if(lp.cy<70) scrollBy(0,-9); else if(lp.cy>h-90) scrollBy(0,9); else return; update(); },16);
  }
  function update(){
    lp.el.style.transform=`translateY(${lp.cy-lp.y+(scrollY-lp.sy)}px)`;
    let over=lp.over; const first=lp.ids[0].el.getBoundingClientRect(), last=lp.ids[lp.ids.length-1].el.getBoundingClientRect();
    if(lp.cy<first.top) over=0; else if(lp.cy>last.bottom) over=lp.ids.length-1;
    else lp.ids.forEach((x,i)=>{ const r=x.el.getBoundingClientRect(); if(lp.cy>=r.top&&lp.cy<=r.bottom) over=i; });
    if(over!==lp.over){ lp.over=over; haptic(); }
    lp.ids.forEach((x,i)=>{ x.el.classList.toggle("drop-before",i===over&&over<lp.from); x.el.classList.toggle("drop-after",i===over&&over>lp.from); });
  }
  document.addEventListener("touchstart",e=>{
    clear();
    if(!mq.matches||e.touches.length!==1||form) return;
    const el=e.target.closest(".item[data-item]"); if(!el||e.target.closest("button,a,input,label,textarea,select")) return;
    const t=e.touches[0]; lp={el,x:t.clientX,y:t.clientY,cy:t.clientY,on:false,timer:setTimeout(start,380)};
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!lp) return; const t=e.touches[0];
    if(!lp.on){ if(Math.hypot(t.clientX-lp.x,t.clientY-lp.y)>10) clear(); return; }
    e.preventDefault(); lp.cy=t.clientY; update();
  },{passive:false});
  const end=()=>{
    if(lp&&lp.on&&lp.over!==lp.from){
      const d=findDay(lp.el.dataset.day), fromId=lp.ids[lp.from].id, overId=lp.ids[lp.over].id;
      const fi=d.items.findIndex(i=>i.id===fromId), oi=d.items.findIndex(i=>i.id===overId);
      clear();
      if(fi>=0&&oi>=0){ const [m]=d.items.splice(fi,1); d.items.splice(oi,0,m); commit(); toast("已調整順序"); }
      return;
    }
    clear();
  };
  document.addEventListener("touchend",end); document.addEventListener("touchcancel",clear);
  document.addEventListener("contextmenu",e=>{ if(mq.matches&&e.target.closest(".item")) e.preventDefault(); });
})();
